<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./src/assets/flowops.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowOps — Build, automate and optimize CI/CD workflows</title>
  <meta name="description" content="Configure GitHub Actions workflows visually, preview generated YAML, run pipelines and inspect execution logs with FlowOps." />
  <meta name="theme-color" content="#0b1020" />
  <script>
    try {
      const language = localStorage.getItem("flowops_language");
      // Applique le thème avant le premier rendu (évite le flash).
      const theme = localStorage.getItem("flowops_theme");
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      document.documentElement.lang = language === "fr" ? "fr" : "en";
    } catch {
      document.documentElement.dataset.theme = "dark";
      document.documentElement.lang = "en";
    }
  </script>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FlowOps — Build, automate and optimize CI/CD workflows" />
  <meta property="og:description" content="Configure GitHub Actions workflows visually, preview generated YAML, run pipelines and inspect execution logs with FlowOps." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FlowOps — Build, automate and optimize CI/CD workflows" />
  <meta name="twitter:description" content="Configure GitHub Actions workflows visually, preview generated YAML, run pipelines and inspect execution logs with FlowOps." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
