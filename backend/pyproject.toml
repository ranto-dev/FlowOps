[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "mlruns", "generated", "generated_workflows", "mlops/data"]

[tool.ruff.lint]
# E4/E7/E9/F = règles par défaut ruff ; I = tri des imports (activé à la
# création de app/routers/ : les imports doivent rester reproductibles).
select = ["E4", "E7", "E9", "F", "I"]
